name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade pip && pip install "huggingface_hub[cli]>=0.23.0"
      - name: Upload API Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_API_SPACE }}
        run: |
          python -m pip install -r requirements.txt
          mkdir -p space_api
          cp -r api artifacts model_registry requirements.txt Dockerfile space_api/
          cd space_api
          huggingface-cli repo create "$HF_SPACE" --type space --space-sdk docker --yes --token "$HF_TOKEN"
          huggingface-cli upload . "$HF_SPACE" --repo-type space --token "$HF_TOKEN"

  deploy-monitor:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade pip && pip install "huggingface_hub[cli]>=0.23.0"
      - name: Upload Monitor Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_MONITOR_SPACE }}
        run: |
          mkdir -p space_monitor
          cp -r monitor artifacts data/reference requirements-monitor.txt Dockerfile.monitor space_monitor/
          cd space_monitor
          huggingface-cli repo create "$HF_SPACE" --type space --space-sdk docker --yes --token "$HF_TOKEN"
          huggingface-cli upload . "$HF_SPACE" --repo-type space --token "$HF_TOKEN"
