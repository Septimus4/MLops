name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check api monitor scripts tests
      - name: Run tests
        run: pytest -q --cov=api --cov=monitor --cov-report=term-missing
      - name: Build API image
        run: docker build -t home-credit-api .
      - name: Build monitor image
        run: docker build -t home-credit-monitor -f Dockerfile.monitor .
