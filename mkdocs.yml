site_name: Home Credit Risk Service
site_description: MLOps system for Home Credit default risk prediction
site_author: MLOps Team

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Documentation: api.md
  - Drift Monitoring: drift_monitoring.md
  - Deployment: deployment.md

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Septimus4/MLOps2
