[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "site"]
# Keep checks to essential errors; ignore style/modernization for now
select = ["E", "F"]
ignore = [
	"E501",
	"I001",
	"UP006", "UP007", "UP017", "UP035", "UP015"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
omit = [
	"src/training/compute_baseline_stats.py",  # optional script
]

